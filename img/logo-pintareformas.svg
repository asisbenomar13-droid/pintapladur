<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <!-- Fondo transparente -->

  <!-- Letra P naranja grande -->
  <text x="0" y="46"
        font-family="'Arial Black','Arial',Impact,sans-serif"
        font-weight="900"
        font-size="52"
        fill="#FF9800">P</text>

  <!-- INTA blanco, tamaño menor -->
  <text x="38" y="46"
        font-family="'Arial Black','Arial',Impact,sans-serif"
        font-weight="900"
        font-size="36"
        fill="#FFFFFF">INTA</text>

  <!-- Línea naranja separadora -->
  <rect x="0" y="51" width="210" height="2" rx="1" fill="#FF9800" opacity="0.5"/>

  <!-- PLADUR espaciado abajo -->
  <text x="2" y="60"
        font-family="Arial,sans-serif"
        font-weight="700"
        font-size="9.5"
