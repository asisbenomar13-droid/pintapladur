<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#e68900"/>
    </linearGradient>
    <filter id="sombra2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0D1B2A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo círculo azul marino -->
  <circle cx="60" cy="60" r="58" fill="#0D1B2A" filter="url(#sombra2)"/>

  <!-- Letra P enorme centrada -->
  <text x="17" y="88"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="90"
        fill="url(#bgP2)">P</text>

  <!-- Pincelada bajo la P -->
  <rect x="17" y="92" width="70" height="7" rx="3.5" fill="#FF9800" opacity="0.3"/>
  <rect x="17" y="92" width="38" height="7" rx="3.5" fill="#FF9800" opacity="0.65"/>
</svg>
